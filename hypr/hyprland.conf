---------------------------
---- RULES ----------------
---------------------------
-- "No gaps when only one window" (same pattern as the stock example config)
hl.workspace_rule({ workspace = "w[tv1]", gaps_in = 0, gaps_out = 0 })
hl.workspace_rule({ workspace = "f[1]",   gaps_in = 0, gaps_out = 0 })

hl.window_rule({
    name  = "no-gaps-wtv1",
    match = { float = false, workspace = "w[tv1]" },
    border_size = 0,
    rounding    = 0,
})
hl.window_rule({
    name  = "no-gaps-f1",
    match = { float = false, workspace = "f[1]" },
    border_size = 0,
    rounding    = 0,
})

hl.window_rule({
    name  = "lilithsthrone-no-initial-focus",
    match = { class = "^(com\\.lilithsthrone\\.main\\.Main)$", title = "^$" },
    no_initial_focus = true,
})

hl.window_rule({
    name  = "suppress-maximize-events",
    match = { class = ".*" },
    suppress_event = "maximize",
})

---------------------------
---- KEYBINDS -------------
---------------------------
hl.bind("CTRL + SHIFT + code:35", hl.dsp.exec_cmd("fcitx5-remote -t"))

-- Layout switching: hl.config() is just a Lua call, so it can be run from a bind.
hl.bind(mainMod .. " + I", function() hl.config({ general = { layout = "dwindle" } }) end)
hl.bind(mainMod .. " + M", function() hl.config({ general = { layout = "master" } }) end)
-- Original: `bindr = $mainMod, M, movewindow, l` — "a hack to make selected window in dwindle a new
-- master". bindr = on release. Both binds on one key run top-to-bottom, same as before.
hl.bind(mainMod .. " + M", hl.dsp.window.move({ direction = "left" }), { release = true })

hl.bind(mainMod .. " + Return", hl.dsp.exec_cmd(terminal))
hl.bind(mainMod .. " + B",      hl.dsp.exec_cmd(browser))
hl.bind(mainMod .. " + F",      hl.dsp.exec_cmd(fileManager))
hl.bind(mainMod .. " + D",      hl.dsp.exec_cmd(menu))
hl.bind(mainMod .. " + X",      hl.dsp.window.close())
hl.bind(mainMod .. " + SHIFT + Q", hl.dsp.exit()) -- hl.dsp.exit() DOES exist; wiki recommends hyprshutdown instead
hl.bind(mainMod .. " + space",  hl.dsp.window.float({ action = "toggle" }))
hl.bind(mainMod .. " + P",      hl.dsp.window.pseudo())
hl.bind(mainMod .. " + E",      hl.dsp.layout("togglesplit"))
hl.bind(mainMod .. " + W",      hl.dsp.window.fullscreen({ mode = "fullscreen" }))

-- Clipboard history (long string avoids escaping the inner quotes)
hl.bind(mainMod .. " + V", hl.dsp.exec_cmd([[cliphist list | xargs -d "\n" printf "%q\n" | sort -r | wofi --insensitive --dmenu --pre-display-cmd "echo -n %s | cut -z -f 2" | xargs -0 -I {} bash -c "echo {}" | cliphist decode | wl-copy]]))

-- Screenshots
local screenshot = [[grim -g "$(slurp)" - | swappy -f -]]
hl.bind("Print",                   hl.dsp.exec_cmd(screenshot))
hl.bind(mainMod .. " + SHIFT + S", hl.dsp.exec_cmd(screenshot))

-- Focus / move with hjkl
hl.bind(mainMod .. " + H", hl.dsp.focus({ direction = "left" }))
hl.bind(mainMod .. " + L", hl.dsp.focus({ direction = "right" }))
hl.bind(mainMod .. " + K", hl.dsp.focus({ direction = "up" }))
hl.bind(mainMod .. " + J", hl.dsp.focus({ direction = "down" }))
hl.bind(mainMod .. " + SHIFT + H", hl.dsp.window.move({ direction = "left" }))
hl.bind(mainMod .. " + SHIFT + L", hl.dsp.window.move({ direction = "right" }))
hl.bind(mainMod .. " + SHIFT + K", hl.dsp.window.move({ direction = "up" }))
hl.bind(mainMod .. " + SHIFT + J", hl.dsp.window.move({ direction = "down" }))

-- Workspaces 1-10 (key 0 = workspace 10)
for i = 1, 10 do
    local key = i % 10
    hl.bind(mainMod .. " + " .. key,            hl.dsp.focus({ workspace = i }))
    hl.bind(mainMod .. " + SHIFT + " .. key,    hl.dsp.window.move({ workspace = i, follow = false })) -- movetoworkspacesilent
end

-- Relative workspace switching
-- Original was `binde` (repeat while held); the migrator turned that into "longpress".
hl.bind(mainMod .. " + comma",  hl.dsp.focus({ workspace = "-1" }), { repeating = true })
hl.bind(mainMod .. " + period", hl.dsp.focus({ workspace = "+1" }), { repeating = true })
-- Original was `movetoworkspace` (move window AND follow it); the migrator turned it into plain focus.
hl.bind(mainMod .. " + SHIFT + comma",  hl.dsp.window.move({ workspace = "-1" }))
hl.bind(mainMod .. " + SHIFT + period", hl.dsp.window.move({ workspace = "+1" }))
hl.bind(mainMod .. " + mouse_up",   hl.dsp.focus({ workspace = "e+1" }))
hl.bind(mainMod .. " + mouse_down", hl.dsp.focus({ workspace = "e-1" }))

-- Mouse binds
hl.bind(mainMod .. " + mouse:272", hl.dsp.window.drag(),   { mouse = true })
hl.bind(mainMod .. " + mouse:273", hl.dsp.window.resize(), { mouse = true })
hl.bind("mouse:279", hl.dsp.window.drag(),   { mouse = true })
hl.bind("mouse:281", hl.dsp.window.resize(), { mouse = true })

-- Alt-tab style: cycle then raise (verbatim from the wiki's "Multiple binds to one key")
hl.bind(mainMod .. " + Tab", function()
    hl.dispatch(hl.dsp.window.cycle_next())
    hl.dispatch(hl.dsp.window.alter_zorder({ mode = "top" }))
end)

-- Media keys — restored 1:1 from the original (the migrator dropped all but one of these).
-- bindel = repeating + locked, bindl = locked.
hl.bind("XF86AudioRaiseVolume",  hl.dsp.exec_cmd("wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"), { repeating = true, locked = true })
hl.bind("XF86AudioLowerVolume",  hl.dsp.exec_cmd("wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"), { repeating = true, locked = true })
hl.bind("XF86AudioMute",         hl.dsp.exec_cmd("wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"), { locked = true })
hl.bind("XF86MonBrightnessUp",   hl.dsp.exec_cmd("brightnessctl set +5%"), { repeating = true, locked = true })
hl.bind("XF86MonBrightnessDown", hl.dsp.exec_cmd("brightnessctl set 5%-"), { repeating = true, locked = true })

---------------------------
---- AUTOSTART ------------
---------------------------
hl.on("hyprland.start", function()
    hl.exec_cmd("kanshi")
    hl.exec_cmd("/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1")
    hl.exec_cmd("hypridle")
    hl.exec_cmd("wl-paste --type text --watch cliphist store")
    hl.exec_cmd("wl-paste --type image --watch cliphist store")
    -- exec rules: "[workspace N silent]" prefix is gone; rules are a table on exec_cmd.
    hl.dispatch(hl.dsp.exec_cmd("kitty",            { workspace = "1 silent" }))
    hl.dispatch(hl.dsp.exec_cmd("firefox",          { workspace = "2 silent" }))
    hl.dispatch(hl.dsp.exec_cmd("telegram-desktop", { workspace = "9 silent" }))
    hl.dispatch(hl.dsp.exec_cmd("thunderbird",      { workspace = "10 silent" }))
    hl.exec_cmd("sleep 1 && eww daemon --force-wayland && eww open bar && sleep 1 && ~/.config/eww/scripts/hyprland-stream.sh")
    -- These were plain `exec` (ran on every reload). Once at start is almost certainly what you want.
    hl.exec_cmd("fcitx5 -dr --keep")
    hl.exec_cmd("systemctl --user start hyprland-session.target")
end)

---------------------------
---- ANIMATIONS -----------
---------------------------
hl.curve("myBezier", { type = "bezier", points = { {0.05, 0.9}, {0.1, 1.05} } })

hl.animation({ leaf = "windows",     enabled = true, speed = 7,  bezier = "myBezier" })
hl.animation({ leaf = "windowsOut",  enabled = true, speed = 7,  bezier = "default", style = "popin 80%" })
hl.animation({ leaf = "border",      enabled = true, speed = 10, bezier = "default" })
hl.animation({ leaf = "borderangle", enabled = true, speed = 8,  bezier = "default" })
hl.animation({ leaf = "fade",        enabled = true, speed = 7,  bezier = "default" })
hl.animation({ leaf = "workspaces",  enabled = true, speed = 6,  bezier = "default" })
