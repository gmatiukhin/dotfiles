-- hyprland.lua
-- Hand-fixed from hypr-migrate output. Verified against https://wiki.hypr.land/ (Nov 2026).

local terminal    = "kitty"
local browser     = "firefox"
local fileManager = "thunar"
local menu        = "wofi --show drun --insensitive"
local mainMod     = "SUPER"

---------------------------
---- ENVIRONMENT ----------
---------------------------
hl.env("XCURSOR_THEME", "Default")
hl.env("XCURSOR_SIZE", "24")
hl.env("QT_QPA_PLATFORMTHEME", "qt5ct")
hl.env("GTK_IM_MODULE", "fcitx")
hl.env("QT_IM_MODULE", "fcitx")
hl.env("GLFW_IM_MODULE", "fcitx")
hl.env("XMODIFIERS", "@im=fcitx")
hl.env("EDITOR", "/bin/nvim")
hl.env("VISUAL", "/bin/nvim")
hl.env("XDG_CURRENT_DESKTOP", "Hyprland")
hl.env("XDG_SESSION_TYPE", "wayland")
hl.env("XDG_SESSION_DESKTOP", "Hyprland")

---------------------------
---- CONFIG ---------------
---------------------------
hl.config({
